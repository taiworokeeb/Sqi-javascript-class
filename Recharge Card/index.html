<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<style>
    table{
        width: 95%;
        margin: auto;
        margin-top: 30px;
        border-collapse:collapse ;
        /* border:1px; */
        text-align: center;
        background-color: azure;

    }
    th, td{
        padding: 10px;
        font-size: 20px;
        border: 2px solid black;
    }
    tbody{
        border: solid black 1px;
        text-align: center;
    }
    section{
        background-color: rgb(170, 112, 122);
        margin-top: 30px;
        padding: 20px;
        /* display: flex;
        justify-content: center;
        width: 100%; */
    }
    /* button{
        display:block;
    } */
    h3{
        border-bottom: dotted rgb(41, 37, 37) 4px;
        /* background-color: red; */
        text-align: center;
    }
    div{
        width: 90%;
        margin: auto;
        display: flex;
        justify-content: space-between;
    }
    form{
        width: 48%;
        font-size: 40px;
    }
    #generatePin{
        width: 48%;
    }
    #save{
        width: 48%;
    }
    #recharge{
        width: 100%;
    }
    p{
        color: red;
    }
</style>
<body>
    <section>
        <h3>Rechard Card Generator</h3>
    <div>
    <form action="">
        <label for="selectNetwork" class="form-label">Network:</label>
        <select class="form-select" aria-label="Default select example" id="selectNetwork">
            <option selected>Select a Network</option>
            <option value="*555*">MTN</option>
            <option value="*126*">Airtel</option>
            <option value="*123*">Glo</option>
            <option value="*222*">9mobile</option>
        </select>
        <label for="inputAmount" class="form-label">Amount:</label>
        <input type="number" id="inputAmount" class="form-control" aria-describedby="passwordHelpBlock" placeholder="Input an Amount">
        <label for="generateCode" class="form-label">Generate Code:</label>
        <input type="number" id="generateCode" class="form-control" aria-describedby="passwordHelpBlock" readonly>
        <button type="button" class="btn btn-primary" id="generatePin">Generate Pin</button>
        <button type="button" class="btn btn-primary" id="save">Save Pin</button>
    </form>
    <form action="">
        <label for="inputPin" class="form-label">Recharge Code:</label>
        <input type="text" id="rechargeInput" class="form-control" aria-describedby="passwordHelpBlock">
        <p id="demo"></p>
        <button type="button" class="btn btn-primary" id="recharge" onclick="rechargeCard()" placeholder="Enter Recharge Code">Recharge</button> <br>
        <label for="searchCode" class="form-label">Search:</label>
        <input type="text" id="searchCode" class="form-control" aria-describedby="passwordHelpBlock" placeholder="Recharge Code">
    </form>
    </div>    
    </section>
    <table border="1px">
        <thead>
            <tr>
                <th>S/N</th>
                <th>Network</th>
                <th>Amount</th>
                <th>pin</th>
                <th>Recharge Code</th>
                <th>Status</th>
                <th>Date Created</th>
                <th>Date Used</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="display">

        </tbody>
        
    </table>
</body>
<script>
    let network = document.getElementById("selectNetwork");
    let amount = document.getElementById("inputAmount");
    let generateCode = document.getElementById("generateCode");
    let generatePin = document.getElementById("generatePin");
    let save = document.getElementById("save");
    let dispay = document.getElementById("display");
    let recharge = document.getElementById("recharge");
    let rechargeInput = document.getElementById("rechargeInput");
    let demo = document.getElementById("demo");
    let arr = JSON.parse(localStorage.getItem("users")) || [];
    // console.log(network.value);
    
    generatePin.addEventListener("click", () => {
        let random = Math.floor(Math.random() * 1000000000000);
        generateCode.value = random;
    })

    save.addEventListener("click", () => {
        let networkValue = network.options[network.selectedIndex].text;
        let amountValue = amount.value;
        let codeValue =network.value + generateCode.value + "#";
        // let dateValue = date.toLocaleDateString();
        let obj ={
            network:networkValue,
            amount: amountValue,
            pin: network.value,
            code: codeValue,
            status: "Unused",
            dateCreated: new Date().toLocaleDateString(),
            dateUsed:""
        }
            arr.push(obj);
            console.log(arr);
            amount.value = "";
            generateCode.value = "";
            network.value = "";


            localStorage.setItem("users", JSON.stringify(arr));
            showMe();
            rechargeCard();

        });
        function showMe() {
            display.innerHTML = "";
            arr.forEach((items , index, array)=> {
                display.innerHTML += `<tr>
                <td>${index + 1}</td>
                <td>${items.network}</td>
                <td>${items.amount}</td>
                <td>${items.pin}</td>
                <td>${items.code}</td>
                <td>${items.status}</td>
                <td>${items.dateCreated}</td>
                <td>${items.dateUsed}</td>
                <td><button onclick="deleteCard(${index})">Delete</button></td>
                </tr>`
            });
        }

        showMe();

        function deleteCard(index) {
            arr.splice(index, 1);
            localStorage.setItem("users", JSON.stringify(arr));
            showMe()
        }
        // recharge.addEventListener("click", rechargeCard);

        function rechargeCard() {
            let card;
            let cardIndex;                        

            arr.forEach((items, index) => {
                if (items.code == rechargeInput.value) {
                card = items;
                cardIndex = index;
                }
            });

            if (!card) {
                demo.innerHTML = "Invalid code";
            } else if (card.status == "used") {
                demo.innerHTML = "Card has already been used";
            } else {
                demo.innerHTML = "Loaded successfully";

                arr[cardIndex].status = "used";
                arr[cardIndex].dateUsed = new Date().toLocaleDateString();

                localStorage.setItem("users", JSON.stringify(arr));
                showMe();
            }

            rechargeInput.value = "";
        }
        
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</html>
