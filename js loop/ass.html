<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .container{
        display: grid;
        grid-template-columns: repeat(4 , auto);
        background-color: whitesmoke;
    }
    .div{
        /* border: solid; */
        text-align: center;
        margin: 10px;
    }
</style>
<body>
    <input type="number" id="firstInput" placeholder="Input a value">
    <input type="number" id="secondInput" placeholder="Input a value">
    <button onclick="checkMul()">Click</button>


    <script>
        let firstInput = document.getElementById("firstInput")
        let secondInput = document.getElementById("secondInput")
        let container = document.createElement("div")
                container.className = "container"
        function checkMul() {        
            container.innerHTML = "" ;
            if (firstInput.value == "" && secondInput.value == "") {
                container.innerHTML = "Plss input a value"
            }else{
            for (let index = Number(firstInput.value); index <= Number(secondInput.value); index++) {
            let div = document.createElement("div")
                div.className = "div"
            for (let secondIndex = 1; secondIndex <= 12; secondIndex++) {
                let answer = index * secondIndex
                // console.log(`${index} * ${secondIndex} = ${answer}`);
                let display = document.createElement("p")
                display.innerText = `${index} * ${secondIndex} = ${answer}`
                div.appendChild(display)
            }
            container.appendChild(div)
        }
            }
        document.body.appendChild(container)
        firstInput.value = "";
        secondInput.value = ""; 
        }
       
        </script>
    </body>
</html>
