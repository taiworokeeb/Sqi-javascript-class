<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        padding: 40px 20px;
        font-family: Arial, sans-serif;
        background: #f3f5f9;
        color: #1f2937;
    }

    #display {
        width: min(100%, 850px);
        margin: auto;
    }

    /* Each blog starts with an image, followed by four elements */
    #display > img:nth-child(5n + 1),
    #display > h1:nth-child(5n + 2),
    #display > p:nth-child(5n + 3),
    #display > p:nth-child(5n + 4),
    #display > p:nth-child(5n + 5) {
        display: block;
        width: 100%;
        margin: 0;
        background: #ffffff;
        padding-left: 24px;
        padding-right: 24px;
    }

    #display > img:nth-child(5n + 1) {
        height: 300px;
        padding: 0;
        object-fit: cover;
        border-radius: 16px 16px 0 0;
    }

    #display > h1:nth-child(5n + 2) {
        padding-top: 22px;
        padding-bottom: 12px;
        font-size: 1.7rem;
        color: #111827;
    }

    #display > p:nth-child(5n + 3) {
        padding-bottom: 16px;
        line-height: 1.7;
        color: #4b5563;
    }

    #display > p:nth-child(5n + 4) {
        padding-bottom: 8px;
        font-weight: bold;
        color: #2563eb;
    }

    #display > p:nth-child(5n + 5) {
        padding-bottom: 22px;
        border-radius: 0 0 16px 16px;
        margin-bottom: 28px;
        color: #6b7280;
        box-shadow: 0 8px 22px rgba(0, 0, 0, 0.08);
    }
    .form-container {
        width: 100%;
        max-width: 500px;
        margin-bottom: 50px;
        background: white;
        padding: 25px;
        border-radius: 10px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }
    h2 {
        text-align: center;
        margin-bottom: 25px;
    }
    form {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }
    label {
        font-weight: bold;
        margin-top: 10px;
    }
    input,
    textarea,
    select {
        width: 100%;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 16px;
    }
    textarea {
        height: 150px;
        resize: vertical;
    }
    button {
        margin-top: 15px;
        padding: 12px;
        border: none;
        border-radius: 6px;
        background: #007bff;
        color: white;
        font-size: 16px;
        cursor: pointer;
    }
    button:hover {
        background: #0056b3;
    }
    </style>
<body>

    <div class="form-container">
    <h2>Add New Blog</h2>

    <form id="blogForm">
        
        <label for="title">Title</label>
        <input type="text" id="title" placeholder="Enter article title">

        <label for="image">Image URL</label>
        <input type="text" id="image" placeholder="Paste image src here">

        <label for="author">Author</label>
        <input type="text" id="author" placeholder="Enter author name">

        <label for="content">Contents</label>
        <textarea id="content" placeholder="Write your contents here..."></textarea>

        <label for="published">Is Published?</label>
        <select id="published">
            <option value="true">True</option>
            <option value="false">False</option>
          </select>

          <button type="button" onclick="addBlog()"> Add </button>

        </form>
    </div>
    <div id="display"></div>

<script type="module">
    // Import the functions you need from the SDKs you need
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import { getFirestore, collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


    // Your web app's Firebase configuration
    const firebaseConfig = {
        apiKey: "AIzaSyAYXNEwVhYeDrv9B1yTlEOcIiy0jFBhN6A",
        authDomain: "blog-26faa.firebaseapp.com",
        projectId: "blog-26faa",
        storageBucket: "blog-26faa.firebasestorage.app",
        messagingSenderId: "98553099435",
        appId: "1:98553099435:web:ecb85b5f9cff595cb4b3ee"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const colRef = collection(db, "myblog");

    let blogs = []; 

    let display = document.getElementById('display');

    const allBlogs = async()=>{
        blogs = [];
        const querysnapshot = await getDocs(colRef);
        console.log(querysnapshot);

        querysnapshot.forEach((doc)=>{
            const data = {id: doc.id, ...doc.data()};
            console.log(data);

            blogs.push(data)
            
            // display(querysnapshot)
            
        })
            displayBlogs();
        
    }

    function displayBlogs() {
            display.innerHTML = '';
            blogs.forEach(blog => {
                display.innerHTML  += `
                        <img src = "${blog.image}" alt = "">
                        <h1>${blog.title}</h1> 
                        <p>${blog.content}</p>
                        <p>${blog.author}</p>
                        <p>${blog.isItPublished}</p>
                `
            });
            
    }

    
    let obj = {}
    async function addBlog() {

        let image = document.getElementById('image').value;
        let title = document.getElementById('title').value;
        let content = document.getElementById('content').value;
        let author = document.getElementById('author').value;
        let isItPublished = document.getElementById('published').value;


        obj ={
            image: image,
            title: title,
            content: content,
            author: author,
            isItPublished: isItPublished
        };
        
        await addDoc(colRef, obj);
        document.getElementById('blogForm').reset();
        allBlogs();

    }
    window.addBlog = addBlog;
    allBlogs();

</script>
</body>
</html>
