<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
    <style>
     * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        padding: 40px 20px;
        font-family: Arial, sans-serif;
        background: #f3f5f9;
        color: #1f2937;
    }
    .form-container {
        width: 50%;
        max-width: 500px;
        margin:auto;
        background: white;
        padding: 25px;
        border-radius: 10px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }
    h2 {
        text-align: center;
        margin-bottom: 25px;
    }
    form {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }
    label {
        font-weight: bold;
        margin-top: 10px;
    }
    input,
    textarea,
    select {
        width: 100%;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 16px;
    }
    textarea {
        height: 150px;
        resize: vertical;
    }
    button {
        margin-top: 15px;
        padding: 12px;
        border: none;
        border-radius: 6px;
        background: #007bff;
        color: white;
        font-size: 16px;
        cursor: pointer;
    }
    button:hover {
        background: #0056b3;
    }
    </style>
<body>
    <div class="form-container">
        <form  id="signIn">

            <label for="username">User Name</label>
            <input type="text" id="username" placeholder="Enter your user name">

            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter your email">

            <label for="password">Passwords</label>
            <input type="password" id="password" placeholder="Enter your password...">

            <button type="submit" id="submitBtn"> Sign In </button>

        </form>
    </div>
    <div id="display"></div>



    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAYXNEwVhYeDrv9B1yTlEOcIiy0jFBhN6A",
            authDomain: "blog-26faa.firebaseapp.com",
            projectId: "blog-26faa",
            storageBucket: "blog-26faa.firebasestorage.app",
            messagingSenderId: "98553099435",
            appId: "1:98553099435:web:ecb85b5f9cff595cb4b3ee"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const colRef = collection(db, "users");

    let signIn = document.getElementById('signIn');
    let username = document.getElementById('username');
    let useremail = document.getElementById('email');
    let userpassword = document.getElementById('password');   
    let display = document.getElementById('display');
    // let submitBtn = document.getElementById('submitBtn');


    
    signIn.addEventListener('submit', async (e) => {
        e.preventDefault();
        // alert("Hello")
        try { 
            const user ={ 
                username: username.value,
                useremail: useremail.value,
                userpassword: userpassword.value
            };
            
            const userCredential = await createUserWithEmailAndPassword(
                auth, 
                user.useremail, 
                user.userpassword);
            console.log(userCredential);
            
            const docRef = await addDoc(colRef, {
                    uid: userCredential.user.uid,
                    username: username.value,
                    email: useremail.value,
                    // password: userpasword.value
                });
            signIn.reset();
            display.textContent = "Account and Firestore profile created!";
        } 
       
        catch (error) {
            console.log(error.message);
        }
    })



    </script>
</body>

</html>
