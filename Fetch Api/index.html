<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Share+Tech+Mono&display=swap');
          body{
        font-family:Arial,sans-serif;
        background-color: #f4f4f4;
        margin: 0;
        padding: 20px;
        /* box-sizing: border-box; */
    }
    #display {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 20px;
        padding: 20px;
        max-width: 1400px;
        margin: auto;
    }
    .card {
        width: 100%;
        padding: 16px;
        border: none;
        border-radius: 12px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
        transition: transform 0.25s ease, box-shadow 0.25s ease;
        font-family: "Space Grotesk", sans-serif;
    }

    .card:hover {
        transform: translateY(-6px);
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.18);
    }
    .card-body {
        height: 240px;
        margin-bottom: 14px;
        padding: 0;
        overflow: hidden;
        border-radius: 8px;
    }
    .card-img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        cursor: pointer;
        transition: transform 0.3s ease;
    }
    .card-img:hover {
    transform: scale(1.05);
    }

    .card h5,
    .card p {
        overflow-wrap: anywhere;
    }
    @media (max-width: 576px) {
        body {
            padding: 10px;
        }

        #display {
            grid-template-columns: 1fr;
            padding: 10px;
            gap: 14px;
        }

        .card {
            padding: 14px;
        }

        .card-body {
            height: 220px;
        }

        .d-grid {
            display: grid !important;
        }

        .d-grid .btn {
            width: 100%;
            margin-bottom: 8px;
        }
    }

    </style>
<body>
    
        <div id="display">

        </div>
        <a href=""></a>

</body>
    <script>
        // html form
        // the work of action in form
        //
        let dispayProducts = document.getElementById('display');

        let baseUrl = "https://fakestoreapi.com/";

        const getData = async () => {
            try{
                let response = await fetch(`${baseUrl}products`);
                console.log(response);
                let actualData = await response.json();
                let allProduct  
                console.log(actualData);
                


                actualData.forEach( (clothingProduct, index, array) => {
                    dispayProducts.innerHTML +=`
                        <div class="card">
                            <div class="card-body">
                                <img src="${clothingProduct.image}" class="card-img" alt="${clothingProduct.title}" onclick="viewProduct(${clothingProduct.id})">
                            </div>
                                <h5><b>Category:</b> ${clothingProduct.category}</h5>
                                <p><b>Description:</b>
                                    <span id= "short-${index}">${clothingProduct.description.slice(0, 50)}...</span>
                                    <span id="full-${index}" style="display: none;"> ${clothingProduct.description}</span>
                                </p>
                                <p><b>Price:</b> ${clothingProduct.price}</p>
                                <p><b>Rating:</b> ${clothingProduct.rating.rate}</p>
                                <p><b>Title:</b> ${clothingProduct.title}</p>

                                <div class="d-grid gap-2 d-md-block">
                                    <button class="btn btn-primary" type="button" id="read-${index}" onclick ="readMore(${index})">Read More</button>
                                    <button class="btn btn-danger" type="button"  onclick= "addCart(${index})">Add to Cart</button>
                                </div>
                        </div> `
                    })
            } catch (error) {
                if (error.message === "Failed to fetch") {
                    console.log("Incorect url");
                    
                }
                // console.log(error.mesage);
                
            }
        }
        getData();
        function readMore(index) {
            let shortDesc = document.getElementById(`short-${index}`);
            let fullDesc = document.getElementById(`full-${index}`);
            let read = document.getElementById(`read-${index}`);
            let expand = fullDesc.style.display === "inline";

            if (expand) {
                shortDesc.style.display = "inline";
                fullDesc.style.display = "none";
                read.innerHTML = "Read More";
            } else {
                shortDesc.style.display = "none";
                fullDesc.style.display = "inline";
                read.innerHTML = "Read Less";
            }
        };

        function viewProduct(productId) {
            // window.location.href = "./product.html"
            window.location.href = `./product.html?id=${productId}`;

        }

    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</html>
